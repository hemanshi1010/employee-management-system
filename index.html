<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #858796;
            --success-color: #1cc88a;
            --info-color: #36b9cc;
        }

        body {
            background: #f0f2f5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #333;
        }

        .container {
            max-width: 900px;
        }

        .card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08) !important;
        }

        .card-header {
            font-weight: 600;
            background-color: transparent !important;
        }

        .btn {
            border-radius: 10px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(78, 115, 223, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(28, 200, 138, 0.3);
        }

        .table thead th {
            background-color: #f8f9fc;
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            color: #5a5c69;
            border-bottom: 2px solid #e3e6f0;
        }

        .table td {
            vertical-align: middle;
            padding: 1rem 0.75rem;
        }

        .form-control,
        .form-check-input {
            border-radius: 8px;
            padding: 0.6rem 1rem;
            border: 1px solid #d1d3e2;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(78, 115, 223, 0.1);
            border-color: var(--primary-color);
        }

        .summary-card h3 {
            font-weight: 700;
        }

        #statusMessage {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1050;
            display: none;
        }
    </style>
</head>

<body>

    <!-- Status Message Toast-like Alert -->
    <div id="statusMessage" class="alert alert-success alert-dismissible fade show shadow" role="alert">
        <span id="statusText">Action successful!</span>
        <button type="button" class="btn-close" onclick="hideStatus()"></button>
    </div>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">Employee Manager</h1>
            <p class="text-muted">Efficiently manage your workforce in one place.</p>
        </div>
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3 border-bottom-0">
                        <h4 class="card-title mb-0 text-center text-primary">Add New Employee</h4>
                    </div>
                    <div class="card-body p-4">
                        <form id="employeeForm">
                            <!-- Employee Name -->
                            <div class="mb-3">
                                <label for="empName" class="form-label">Employee Name</label>
                                <input type="text" class="form-control" id="empName" placeholder="Enter full name"
                                    required>
                            </div>

                            <!-- Employee ID -->
                            <div class="mb-3">
                                <label for="empId" class="form-label">Employee ID</label>
                                <input type="number" class="form-control" id="empId" placeholder="Enter ID" required>
                            </div>

                            <!-- Employee Salary -->
                            <div class="mb-3">
                                <label for="empSalary" class="form-label">Employee Salary</label>
                                <input type="number" class="form-control" id="empSalary" placeholder="Enter salary"
                                    min="1" required>
                            </div>

                            <!-- Employee Gender -->
                            <div class="mb-3">
                                <label class="form-label d-block">Gender</label>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderMale"
                                        value="Male" required>
                                    <label class="form-check-label" for="genderMale">Male</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderFemale"
                                        value="Female">
                                    <label class="form-check-label" for="genderFemale">Female</label>
                                </div>
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="radio" name="gender" id="genderOther"
                                        value="Other">
                                    <label class="form-check-label" for="genderOther">Other</label>
                                </div>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary" id="submitBtn">Submit Employee</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Phase 3: Display Data in Table -->
        <div class="row mt-5">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h4 class="card-title mb-0 text-primary text-center">Employee List</h4>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th class="ps-4">Name</th>
                                        <th>ID</th>
                                        <th>Salary</th>
                                        <th>Gender</th>
                                        <th class="text-center pe-4">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="employeeTableBody">
                                    <!-- Data will be injected here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Phase 7: Summary Section -->
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card shadow-sm border-0 bg-primary text-white">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Employees</h5>
                        <h3 id="totalEmployees" class="mb-0">0</h3>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card shadow-sm border-0 bg-success text-white">
                    <div class="card-body text-center">
                        <h5 class="card-title">Total Salary</h5>
                        <h3 id="totalSalary" class="mb-0">$0</h3>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Phase 2: Create Default Data
        const employees = [
            { id: 101, name: "John Doe", salary: 45000, gender: "Male" },
            { id: 102, name: "Jane Smith", salary: 52000, gender: "Female" },
            { id: 103, name: "Robert Brown", salary: 38000, gender: "Male" },
            { id: 104, name: "Emily Davis", salary: 41000, gender: "Female" },
            { id: 105, name: "Michael Wilson", salary: 47000, gender: "Male" }
        ];

        // Logging the array to console
        console.log("Employees Data:", employees);

        // Phase 3: Display Data in Table
        const employeeTableBody = document.getElementById('employeeTableBody');

        // Phase 8: UI/UX Feedback
        const statusMessage = document.getElementById('statusMessage');
        const statusText = document.getElementById('statusText');

        const showStatus = (message, type = 'success') => {
            statusText.innerText = message;
            statusMessage.className = `alert alert-${type} alert-dismissible fade show shadow`;
            statusMessage.style.display = 'block';
            setTimeout(() => {
                hideStatus();
            }, 3000);                        // hides messages after 3 seconds
        };

        const hideStatus = () => {
            statusMessage.style.display = 'none';
        };

        // Phase 5: Delete Functionality
        const deleteEmployee = (id) => {
            if (confirm("Are you sure you want to delete this employee?")) {
                const index = employees.findIndex(emp => emp.id === id);
                if (index !== -1) {
                    employees.splice(index, 1);
                    renderTable();
                    showStatus("Employee deleted successfully!", "danger");
                }
            }
        };

        // Phase 6: Edit Functionality
        let editMode = false;
        let editEmployeeId = null;

        const editEmployee = (id) => {
            const emp = employees.find(e => e.id === id);
            if (emp) {
                document.getElementById('empName').value = emp.name;
                document.getElementById('empId').value = emp.id;
                document.getElementById('empId').disabled = true;        //prevents editing id
                document.getElementById('empSalary').value = emp.salary;
                document.querySelector(`input[name="gender"][value="${emp.gender}"]`).checked = true;

                editMode = true;
                editEmployeeId = id;
                document.getElementById('submitBtn').innerText = "Update Employee";
                document.getElementById('submitBtn').classList.replace('btn-primary', 'btn-success');

                window.scrollTo({ top: 0, behavior: 'smooth' });
                showStatus("Editing mode active", "info");
            }
        };

        // Updated renderTable to include edit function call and summary updates
        const renderTable = () => {
            employeeTableBody.innerHTML = '';
            let totalSalaryValue = 0;

            employees.forEach((emp) => {
                totalSalaryValue += emp.salary;
                const row = `
                <tr>
                    <td class="ps-4">${emp.name}</td>
                    <td>${emp.id}</td>
                    <td>$${emp.salary.toLocaleString()}</td>
                    <td>${emp.gender}</td>
                    <td class="text-center pe-4">
                        <button class="btn btn-sm btn-outline-primary me-2" onclick="editEmployee(${emp.id})">Edit</button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deleteEmployee(${emp.id})">Delete</button>
                    </td>
                </tr>
            `;
                employeeTableBody.innerHTML += row;
            });

            // Update Summary
            document.getElementById('totalEmployees').innerText = employees.length;
            document.getElementById('totalSalary').innerText = `$${totalSalaryValue.toLocaleString()}`;
        };

        // Initial render
        renderTable();

        // Phase 4 & 6: Add/Update Employee
        const employeeForm = document.getElementById('employeeForm');

        employeeForm.addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('empName').value;
            const id = parseInt(document.getElementById('empId').value);
            const salary = parseFloat(document.getElementById('empSalary').value);
            const gender = document.querySelector('input[name="gender"]:checked').value;

            if (!name || isNaN(id) || isNaN(salary) || salary <= 0) {
                alert("Please provide valid details.");
                return;
            }

            if (editMode) {
                const index = employees.findIndex(emp => emp.id === editEmployeeId);
                if (index !== -1) {
                    employees[index] = { id: editEmployeeId, name, salary, gender };
                    showStatus("Employee updated successfully!", "success");
                }

                editMode = false;
                editEmployeeId = null;
                document.getElementById('empId').disabled = false;
                document.getElementById('submitBtn').innerText = "Submit Employee";
                document.getElementById('submitBtn').classList.replace('btn-success', 'btn-primary');
            } else {
                // Check if ID already exists
                if (employees.some(emp => emp.id === id)) {
                    showStatus("Error: Employee ID already exists!", "danger");
                    return;
                }
                const newEmployee = { id, name, salary, gender };
                employees.push(newEmployee);
                showStatus("Employee added successfully!", "success");
            }

            renderTable();
            employeeForm.reset();
        });
    </script>

</body>

</html>
